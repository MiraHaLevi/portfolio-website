<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/tokens/colors.css">
<link rel="stylesheet" href="ds/tokens/typography.css">
<link rel="stylesheet" href="ds/tokens/spacing.css">
<link rel="stylesheet" href="ds/tokens/radius-shadow.css">
<link rel="stylesheet" href="ds/tokens/motion.css">
<link rel="stylesheet" href="ds/styles.css">
<script src="ds/_ds_bundle.js"></script>
<style>
html { scroll-behavior: smooth; } body { margin: 0; } * { box-sizing: border-box; }
::selection { background: rgba(168,71,90,0.18); }
a { color: var(--link-default); } a:hover { color: var(--link-hover); }
.mh-input { font-family: var(--font-sans); font-size: 15px; padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--white); color: var(--ink); width: 100%; }
.mh-input:focus { outline: 2px solid var(--pink-300); outline-offset: 1px; }
@media (max-width: 860px) { .contact-grid { grid-template-columns: 1fr !important; } }
</style>
</helmet>
<div style="background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);overflow-x:hidden;position:relative">

<header style="position:sticky;top:0;z-index:1000;background:rgba(255,255,255,0.86);backdrop-filter:blur(10px);border-bottom:var(--border-hairline)">
<div style="max-width:var(--container-max);margin:0 auto;padding:18px var(--gutter);display:flex;align-items:center;justify-content:space-between">
<a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
<img src="assets/logo/mark-ink.svg" alt="Mira" style="height:38px;width:auto">
</a>
<nav style="display:flex;gap:30px;align-items:center">
<a href="Home.dc.html" style="text-decoration:none;color:var(--ink-70);font-size:14.5px;font-weight:600">Home</a>
<a href="Work.dc.html" style="text-decoration:none;color:var(--ink-70);font-size:14.5px;font-weight:600">Projects</a>
<a href="About.dc.html" style="text-decoration:none;color:var(--ink-70);font-size:14.5px;font-weight:600">About</a>
<a href="Contact.dc.html" style="text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:600;padding-bottom:6px;border-bottom:2px solid var(--accent-primary)">Contact</a>
<x-import component-from-global-scope="MiraHaleviDesignSystem_de6578.Button" hint-size="auto,36px" variant="primary" size="sm" onClick="{{ noop }}">Let's talk</x-import>
</nav>
</div>
</header>

<section style="max-width:var(--container-max);margin:0 auto;padding:var(--space-9) var(--gutter) var(--space-9)">
<div class="contact-grid" style="display:grid;grid-template-columns:1fr 1.1fr;gap:64px;align-items:start">
<div>
<span style="font-family:var(--font-sans);font-size:13px;font-weight:700;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--pink-600)">Contact</span>
<h1 style="font-family:var(--font-serif);font-weight:600;font-style:italic;font-size:clamp(2.25rem,1.4rem + 3vw,4rem);line-height:1.1;color:var(--ink);margin:16px 0 0">Let's talk.</h1>
<p style="font-family:var(--font-sans);font-size:var(--text-body-lg);color:var(--ink-70);line-height:var(--lh-relaxed);font-weight:var(--weight-light);max-width:440px;margin:22px 0 0">Have a project, an idea, a question, or just want to say hi? I'd love to hear from you.</p>

<div style="display:flex;align-items:center;gap:20px;margin:36px 0 32px;flex-wrap:wrap">
<a href="mailto:mirahalevi.professional@gmail.com" style="font-family:var(--font-serif);font-weight:600;font-style:italic;font-size:clamp(1.2rem,2vw,1.5rem);color:var(--pink-600);text-decoration:none">mirahalevi.professional@gmail.com</a>
</div>
<div style="display:flex;gap:16px">
<a href="https://linkedin.com/in/miriam-halevi-a298062a7" target="_blank" rel="noopener" aria-label="LinkedIn" data-cursor="View" style="display:flex;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);align-items:center;justify-content:center;transition:background var(--dur-fast) var(--ease-out)" style-hover="background:var(--surface-alt)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--ink)"><path d="M4.98 3.5C4.98 4.88 3.88 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8h4V23h-4V8zm7 0h3.84v2.05h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.77 2.65 4.77 6.1V23h-4v-6.98c0-1.66-.03-3.8-2.32-3.8-2.32 0-2.68 1.81-2.68 3.68V23h-4V8z"></path></svg>
</a>
<a href="https://www.instagram.com/elahm123456_art?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener" aria-label="Instagram" data-cursor="View" style="display:flex;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);align-items:center;justify-content:center;transition:background var(--dur-fast) var(--ease-out)" style-hover="background:var(--surface-alt)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.4" cy="6.6" r="1"></circle></svg>
</a>
</div>
</div>

<form ref="{{ setFormRef }}" onSubmit="{{ handleSubmit }}" style="display:flex;flex-direction:column;gap:20px;padding:36px;background:var(--surface-alt);border-radius:var(--radius-lg)">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div>
<label style="display:block;font-size:13px;font-weight:600;color:var(--ink-70);margin-bottom:6px">Name</label>
<input ref="{{ setNameRef }}" type="text" name="name" required="true" class="mh-input">
</div>
<div>
<label style="display:block;font-size:13px;font-weight:600;color:var(--ink-70);margin-bottom:6px">Email</label>
<input ref="{{ setEmailRef }}" type="email" name="email" required="true" class="mh-input">
</div>
</div>
<div>
<label style="display:block;font-size:13px;font-weight:600;color:var(--ink-70);margin-bottom:6px">Subject</label>
<input ref="{{ setSubjectRef }}" type="text" name="subject" required="true" class="mh-input">
</div>
<div>
<label style="display:block;font-size:13px;font-weight:600;color:var(--ink-70);margin-bottom:6px">Message</label>
<textarea ref="{{ setMessageRef }}" name="message" required="true" rows="6" class="mh-input" style="resize:vertical;font-family:var(--font-sans)"></textarea>
</div>
<x-import component-from-global-scope="MiraHaleviDesignSystem_de6578.Button" hint-size="auto,52px" variant="primary" size="lg" type="submit">Send it my way</x-import>
<sc-if value="{{ status }}" hint-placeholder-val="{{ '' }}">
<p style="font-family:var(--font-sans);font-size:14.5px;font-weight:600;margin:0;color:{{ statusColor }}">{{ statusMessage }}</p>
</sc-if>
</form>
</div>
</section>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { status: '' };

  componentDidMount() { import('./cursor.js').then((m) => m.initCursor()); }

  setFormRef = (el) => { this.formEl = el; };
  setNameRef = (el) => { this.nameEl = el; };
  setEmailRef = (el) => { this.emailEl = el; };
  setSubjectRef = (el) => { this.subjectEl = el; };
  setMessageRef = (el) => { this.messageEl = el; };

  handleSubmit = (e) => {
    e.preventDefault();
    if (this.formEl && !this.formEl.checkValidity()) {
      this.formEl.reportValidity();
      return;
    }
    try {
      const name = this.nameEl.value, email = this.emailEl.value, subject = this.subjectEl.value, message = this.messageEl.value;
      const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\n${message}`);
      const mailto = `mailto:mirahalevi.professional@gmail.com?subject=${encodeURIComponent(subject)}&body=${body}`;
      window.location.href = mailto;
      this.setState({ status: 'success' });
      this.formEl.reset();
    } catch (err) {
      this.setState({ status: 'error' });
    }
  };

  renderVals() {
    const s = this.state.status;
    return {
      status: s,
      statusMessage: s === 'success' ? "Message sent! I'll get back to you as soon as I can." : s === 'error' ? 'Something went wrong. Please try again or email me directly.' : '',
      statusColor: s === 'success' ? 'var(--green-700)' : 'var(--pink-600)',
      setFormRef: this.setFormRef,
      setNameRef: this.setNameRef,
      setEmailRef: this.setEmailRef,
      setSubjectRef: this.setSubjectRef,
      setMessageRef: this.setMessageRef,
      handleSubmit: this.handleSubmit,
      noop: () => { window.location.href = 'Contact.dc.html'; }
    };
  }
}
</script>
</body>
</html>
