<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/tokens/colors.css">
<link rel="stylesheet" href="ds/tokens/typography.css">
<link rel="stylesheet" href="ds/tokens/spacing.css">
<link rel="stylesheet" href="ds/tokens/radius-shadow.css">
<link rel="stylesheet" href="ds/tokens/motion.css">
<link rel="stylesheet" href="ds/styles.css">
<script src="ds/_ds_bundle.js"></script>
<script src="./images.js"></script>
<script src="./image-slot.js"></script>
<style>
html { scroll-behavior: smooth; }
body { margin: 0; }
* { box-sizing: border-box; }
::selection { background: rgba(168,71,90,0.18); }
a { color: var(--link-default); }
a:hover { color: var(--link-hover); }
</style>
</helmet>
<div style="background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);overflow-x:hidden;position:relative">

<header style="position:sticky;top:0;z-index:1000;background:rgba(255,255,255,0.86);backdrop-filter:blur(10px);border-bottom:var(--border-hairline)">
<div style="max-width:var(--container-max);margin:0 auto;padding:18px var(--gutter);display:flex;align-items:center;justify-content:space-between">
<a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
<img src="assets/logo/mark-ink.svg" alt="Mira" style="height:38px;width:auto">
</a>
<nav style="display:flex;gap:30px;align-items:center">
<a href="Home.dc.html" style="text-decoration:none;color:var(--ink-70);font-size:14.5px;font-weight:600;padding-bottom:6px;border-bottom:2px solid transparent">Home</a>
<a href="Work.dc.html" style="text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:600;padding-bottom:6px;border-bottom:2px solid var(--accent-primary)">Projects</a>
<a href="About.dc.html" style="text-decoration:none;color:var(--ink-70);font-size:14.5px;font-weight:600;padding-bottom:6px;border-bottom:2px solid transparent">About</a>
<a href="Contact.dc.html" style="text-decoration:none;color:var(--ink-70);font-size:14.5px;font-weight:600;padding-bottom:6px;border-bottom:2px solid transparent">Contact</a>
<x-import component-from-global-scope="MiraHaleviDesignSystem_de6578.Button" hint-size="auto,36px" variant="primary" size="sm" onClick="{{ goToContact }}">Let's talk</x-import>
</nav>
</div>
</header>

<section style="max-width:var(--container-max);margin:0 auto;padding:var(--space-9) var(--gutter) var(--space-7)">
<span style="font-family:var(--font-sans);font-size:13px;font-weight:700;letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--pink-600)">Projects</span>
<h1 style="font-family:var(--font-serif);font-weight:600;font-size:clamp(2rem,3.6vw,3.25rem);color:var(--ink);margin:14px 0 0;letter-spacing:0;line-height:var(--lh-snug);max-width:760px">Branding, photography, animation, and illustration — ten projects, one way of thinking.</h1>
</section>

<section style="max-width:var(--container-max);margin:0 auto;padding:0 var(--gutter) var(--space-9)">
<div style="display:flex;gap:28px;border-bottom:var(--border-hairline);margin-bottom:48px;flex-wrap:wrap">
<sc-for list="{{ categories }}" as="cat" hint-placeholder-count="6">
<button onClick="{{ cat.onClick }}" style="background:none;border:none;font-family:var(--font-sans);font-size:15px;font-weight:600;color:{{ cat.color }};padding:10px 2px 14px;cursor:pointer;position:relative;border-bottom:2px solid {{ cat.borderColor }};transition:color var(--dur-fast) var(--ease-out),border-color var(--dur-base) var(--ease-out)">{{ cat.name }}</button>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:48px 40px">
<sc-for list="{{ projects }}" as="p" hint-placeholder-count="10">
<a href="{{ p.href }}" onMouseEnter="{{ p.onEnter }}" onMouseLeave="{{ p.onLeave }}" data-cursor="View project" style="text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:14px;grid-column:{{ p.gridColumn }};cursor:pointer">
<div data-fixed-ratio="true" style="overflow:hidden;aspect-ratio:{{ p.imgAspect }};position:relative;background:var(--surface-page)">
<div style="width:100%;height:100%;transition:transform var(--dur-slow) var(--ease-out);{{ p.imgScaleCss }}">
<image-slot id="{{ p.imgId }}" shape="rect" fit="contain" placeholder="{{ p.title }}" style="width:100%;height:100%"></image-slot>
</div>
<div style="position:absolute;inset:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-out);{{ p.overlayCss }}"></div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{ p.badges }}" as="b" hint-placeholder-count="2">
<span style="font-family:var(--font-sans);font-size:12.5px;font-weight:600;color:{{ b.fg }};background:{{ b.bg }};padding:5px 13px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;white-space:nowrap">{{ b.name }}</span>
</sc-for>
</div>
</div>
<h3 style="font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--ink);margin:0;letter-spacing:0;display:flex;align-items:center;gap:8px">{{ p.title }}<span style="display:inline-block;transition:transform var(--dur-base) var(--ease-out),opacity var(--dur-base) var(--ease-out);{{ p.arrowCss }}">→</span></h3>
<p style="font-family:var(--font-sans);font-size:14.5px;color:var(--ink-70);margin:0;line-height:1.5;max-width:460px">{{ p.desc }}</p>
</div>
</a>
</sc-for>
</div>
</section>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { activeCategory: 'All', hoveredCard: null };

  componentDidMount() {
    import('./cursor.js').then((m) => m.initCursor());
  }


  projectsData = [
    { id: 'colorplan', title: 'Colorplan Digital Campaign', categories: ['Animation', 'Marketing'], tone: 'green', year: '2024', desc: 'A live brief with GF Smith to create a one-minute animation and digital campaign for Colorplan paper.', href: 'Colorplan-Digital-Campaign.dc.html', imgId: 'project-colorplan', featured: false },
    { id: 'second-act', title: 'The Second Act', categories: ['Conceptual Design', 'Web Design'], tone: 'pink', year: '2024', desc: 'A conceptual digital support platform for people navigating major change between ages 45 and 55.', href: 'The-Second-Act.dc.html', imgId: 'project-second-act', featured: false },
    { id: 'love-war', title: 'Love&War', categories: ['Conceptual Design', 'Branding'], tone: 'green', year: '2023', desc: 'A conceptual hospitality experience developed with Peter Tashjian of Love&War, from strategy to pitch deck.', href: 'Love-War-Mentorship.dc.html', imgId: 'project-love-war', featured: false },
    { id: 'falmouth', title: 'Falmouth Degree Show 2025', categories: ['Branding', 'Conceptual Design', 'Web Design'], tone: 'pink', year: '2023', desc: "A coastal-inspired brand identity and campaign for Falmouth University's 2025 Degree Show.", href: 'Falmouth-Degree-Show.dc.html', imgId: 'project-falmouth', featured: false },
    { id: 'define-feeling', title: 'Define The Feeling', categories: ['Conceptual Design'], tone: 'green', year: '2023', desc: 'A conceptual Merriam-Webster campaign using language to open conversations about mental health.', href: 'Define-The-Feeling.dc.html', imgId: 'project-define-feeling', featured: false },
    { id: 'murder-unladylike', title: 'Murder Most Unladylike', categories: ['Illustration'], tone: 'pink', year: '2022', desc: 'A conceptual cover redesign for the Robin Stevens novel, aimed at its 8–12-year-old readers.', href: 'Murder-Most-Unladylike.dc.html', imgId: 'project-murder-unladylike', featured: false },
    { id: 'postcard-journal', title: 'The Postcard Journal', categories: ['Conceptual Design'], tone: 'green', year: '2022', desc: 'Reimagining journaling as a collection of postcards, free of the pressure of a blank page.', href: 'The-Postcard-Journal.dc.html', imgId: 'project-postcard-journal', featured: false },
    { id: 'halevi-feldman', title: 'HaLevi Feldman Branding', categories: ['Branding', 'Photography'], tone: 'pink', year: '2022', desc: 'A shared visual identity for two independent lawyers combining their practices into one office.', href: 'Halevi-Feldman-Logo-Design.dc.html', imgId: 'project-halevi-feldman', featured: false },
    { id: 'naval-photographer', title: 'Naval Photographer', categories: ['Photography'], tone: 'green', year: '2021', desc: 'Photographs from two years serving as a Navy photographer, alongside work used in Navy media.', href: 'Naval-Photographer.dc.html', imgId: 'project-naval-photographer', featured: false },
    { id: 'tacenda', title: 'Tacenda', categories: ['Photography'], tone: 'pink', year: '2024', desc: 'A final exhibition exploring emotions society tends not to talk about.', href: 'Tacenda.dc.html', imgId: 'project-tacenda', featured: false }
  ];

  setCategory(cat) { return () => this.setState({ activeCategory: cat }); }

  buildProjects() {
    const hov = this.state.hoveredCard;
    return this.projectsData
      .filter((p) => this.state.activeCategory === 'All' || p.categories.includes(this.state.activeCategory))
      .map((p) => {
        const isHover = hov === p.id;
        const bg = p.tone === 'green' ? 'var(--green-50)' : 'var(--pink-50)';
        const fg = p.tone === 'green' ? 'var(--green-700)' : 'var(--pink-700)';
        return {
          ...p,
          badges: p.categories.map((name) => ({ name, bg, fg })),
          onEnter: () => this.setState({ hoveredCard: p.id }),
          onLeave: () => this.setState({ hoveredCard: null }),
          gridColumn: p.featured ? '1 / -1' : 'auto',
          imgAspect: p.featured ? '21/9' : '4/3',
          imgScaleCss: `transform:${isHover ? 'scale(1.045)' : 'scale(1)'}`,
          overlayCss: `background:${p.tone === 'green' ? 'var(--green-600)' : 'var(--pink-500)'};opacity:${isHover ? 0.14 : 0}`,
          arrowCss: `opacity:${isHover ? 1 : 0};transform:translateX(${isHover ? '0' : '-4px'})`
        };
      });
  }

  renderVals() {
    const s = this.state;
    const catColor = (active) => active ? 'var(--ink)' : 'var(--ink-45)';
    const catBorder = (active) => active ? 'var(--accent-primary)' : 'transparent';
    return {
      categories: ['All', 'Branding', 'Photography', 'Animation', 'Conceptual Design', 'Illustration', 'Web Design', 'Marketing'].map((c) => ({
        name: c, color: catColor(s.activeCategory === c), borderColor: catBorder(s.activeCategory === c), onClick: this.setCategory(c)
      })),
      projects: this.buildProjects(),
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      goToContact: () => { window.location.href = 'Contact.dc.html'; }
    };
  }
}
</script>
</body>
</html>
